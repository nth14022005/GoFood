<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <title>Quên mật khẩu - GoFood</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #121212; 
            color: #eee;
            margin: 0; 
            padding: 0; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px 25px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.7);
            width: 350px;
        }
        h2 {
            text-align: center; 
            color: #fff; 
            margin-bottom: 25px;
        }
        label {
            display: block; 
            margin-bottom: 8px;
            color: #ccc;
        }
        input {
            width: 100%; 
            padding: 12px; 
            font-size: 16px; 
            border: 1px solid #444; 
            border-radius: 5px;
            background-color: #222;
            color: #eee;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        input::placeholder {
            color: #777;
        }
        button {
            width: 100%; 
            padding: 12px; 
            background-color: #28a745; 
            border: none; 
            border-radius: 5px; 
            font-size: 16px; 
            color: white; 
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #218838;
        }
        /* Optional: focus effect */
        input:focus {
            outline: none;
            border-color: #28a745;
            box-shadow: 0 0 5px #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Quên mật khẩu</h2>
        <form action="send_reset_link.php" method="POST">
            <label for="email">Nhập email của bạn:</label>
            <input type="email" id="email" name="email" placeholder="email@example.com" required />
            <button type="submit">Gửi liên kết đặt lại mật khẩu</button>
        </form>
    </div>
</body>
</html>
